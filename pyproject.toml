[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vcfscape"
version = "0.1.0"
description = "VCFscape - VCF inspector part of vivaxGEN Project"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    { name = "vivaxGEN Project", email = "researcher@example.org" }
]
keywords = ["bioinformatics", "genomics", "vcf", "malaria", "plasmodium", "tui", "textual", "cyvcf2", "surveillance", "vivaxgen"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "textual>=0.70.0",
    "cyvcf2>=0.30.28",
    "rich>=13.0.0",
    "click>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.20.0",
]

[project.scripts]
vcfscape = "vcfscape.cli:main"
vcfscape-web = "vcfscape.web_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vcfscape"]
